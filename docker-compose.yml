services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"

  exam-service:
    build:
      context: ./exam-service
    image: prajwalbagekari/exam-service:latest
    depends_on:
      - postgres
    ports:
      - "8006:8006"
    env_file:
      - .env

  gateway:
    image: prajwalbagekari/gateway:latest
    ports:
      - "8000:8000"
    env_file:
      - .env

  pdf-service:
    build:
      context: ./pdf-service
    ports:
      - "8001:8001"
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env

  question-service:
    build:
      context: ./question-service
    ports:
      - "8002:8002"
    env_file:
      - .env

  rag-service:
    image: prajwalbagekari/rag-service:latest
    ports:
      - "8003:8003"
    env_file:
      - .env

  image-service:
    image: prajwalbagekari/image-service:latest
    ports:
      - "8005:8005"
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env

  langgraph-service:
    image: prajwalbagekari/langgraph-service:latest
    depends_on:
      - exam-service
      - pdf-service
      - question-service
      - rag-service
      - image-service
    ports:
      - "8008:8008"
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env

volumes:
  uploads: