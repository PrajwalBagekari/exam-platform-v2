services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  exam-service:
    build: ./exam-service

    depends_on:
      - postgres

    ports:
      - "8006:8006"

  gateway:
    build: ./gateway-service
    ports:
      - "8000:8000"

  pdf-service:
    build: ./pdf-service
    ports:
      - "8001:8001"

  question-service:
    build: ./question-service
    ports:
      - "8002:8002"

  rag-service:
    build: ./rag-service
    ports:
      - "8003:8003"

  image-service:
    build: ./image-service
    ports:
      - "8005:8005"

  langgraph-service:
    build: ./langgraph-service

    depends_on:
      - exam-service
      - pdf-service
      - question-service
      - rag-service
      - image-service

    ports:
      - "8008:8008"